<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .star-rating i { cursor: pointer; transition: color 0.2s ease; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-graduation-cap text-3xl"></i>
        <h1 class="text-xl font-bold tracking-tight">Student Feedback Portal</h1>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Feedback Form Section -->
    <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h2 class="text-xl font-bold text-slate-900 mb-1 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square text-indigo-600"></i> Submit Feedback
      </h2>
      <p class="text-sm text-slate-500 mb-6">All fields marked with <span class="text-red-500 font-bold">*</span> are mandatory.</p>

      <form id="feedbackForm" class="space-y-4">
        
        <!-- Name Field (Mandatory) -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            Full Name <span class="text-red-500">*</span>
          </label>
          <input type="text" id="studentName" required placeholder="e.g. Rahul Sharma"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 transition">
        </div>

        <!-- Email ID Field (Mandatory) -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            Email Address <span class="text-red-500">*</span>
          </label>
          <input type="email" id="studentEmail" required placeholder="e.g. rahul@example.com"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 transition">
        </div>

        <!-- Branch / Course Field (Mandatory) -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            Branch / Course <span class="text-red-500">*</span>
          </label>
          <select id="studentBranch" required
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 transition">
            <option value="" disabled selected>Select Branch</option>
            <option value="CSE">Computer Science & Engineering (CSE)</option>
            <option value="CSE-DS">CSE - Data Science</option>
            <option value="ECE">Electronics & Communication (ECE)</option>
            <option value="ME">Mechanical Engineering (ME)</option>
            <option value="CE">Civil Engineering (CE)</option>
            <option value="IT">Information Technology (IT)</option>
          </select>
        </div>

        <!-- Rating Stars -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">Rating</label>
          <div class="flex items-center space-x-2 star-rating" id="starContainer">
            <i class="fa-solid fa-star text-2xl text-amber-400" data-rating="1"></i>
            <i class="fa-solid fa-star text-2xl text-amber-400" data-rating="2"></i>
            <i class="fa-solid fa-star text-2xl text-amber-400" data-rating="3"></i>
            <i class="fa-solid fa-star text-2xl text-amber-400" data-rating="4"></i>
            <i class="fa-solid fa-star text-2xl text-amber-400" data-rating="5"></i>
            <span id="ratingValue" class="text-sm font-semibold text-slate-600 ml-2">5/5</span>
          </div>
        </div>

        <!-- Feedback Field (Mandatory) -->
        <div>
          <label class="block text-sm font-semibold text-slate-700 mb-1">
            Feedback Comment <span class="text-red-500">*</span>
          </label>
          <textarea id="feedbackText" rows="4" required placeholder="Write your detailed feedback here..."
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-slate-900 transition"></textarea>
        </div>

        <button type="submit"
          class="w-full py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-md transition duration-200">
          Submit Feedback
        </button>
      </form>
    </section>

    <!-- Feedback Display Section -->
    <section class="lg:col-span-7 space-y-6">
      <!-- Stats Dashboard -->
      <div class="grid grid-cols-3 gap-4">
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Feedback</p>
          <p id="totalFeedback" class="text-2xl font-bold text-indigo-600">0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Avg Rating</p>
          <p id="avgRating" class="text-2xl font-bold text-amber-500">0.0</p>
        </div>
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
          <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Top Branch</p>
          <p id="topBranch" class="text-2xl font-bold text-slate-700">N/A</p>
        </div>
      </div>

      <!-- Feed Cards List -->
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center justify-between">
          <span>Submitted Feedbacks</span>
        </h3>
        <div id="feedbackList" class="space-y-4">
          <div class="text-center py-8 text-slate-400">
            <i class="fa-regular fa-comments text-4xl mb-2"></i>
            <p>No feedback submitted yet.</p>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript -->
  <script>
    let currentRating = 5;
    let feedbacks = [];

    // Star Rating Logic
    const stars = document.querySelectorAll('#starContainer i');
    const ratingValueDisplay = document.getElementById('ratingValue');

    stars.forEach(star => {
      star.addEventListener('click', () => {
        currentRating = parseInt(star.getAttribute('data-rating'));
        updateStars();
      });
    });

    function updateStars() {
      stars.forEach(s => {
        const rating = parseInt(s.getAttribute('data-rating'));
        if (rating <= currentRating) {
          s.classList.remove('text-slate-300');
          s.classList.add('text-amber-400');
        } else {
          s.classList.remove('text-amber-400');
          s.classList.add('text-slate-300');
        }
      });
      ratingValueDisplay.textContent = `${currentRating}/5`;
    }

    // Form Submission
    const form = document.getElementById('feedbackForm');
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const email = document.getElementById('studentEmail').value.trim();
      const branch = document.getElementById('studentBranch').value;
      const comment = document.getElementById('feedbackText').value.trim();

      // Mandatory validation check
      if (!name || !email || !branch || !comment) {
        alert("Please fill in all mandatory fields (*)");
        return;
      }

      const newFeedback = {
        id: Date.now(),
        name,
        email,
        branch,
        rating: currentRating,
        comment,
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
      };

      feedbacks.unshift(newFeedback);
      renderFeedbacks();
      updateStats();

      // Reset Form
      form.reset();
      currentRating = 5;
      updateStars();
    });

    // Render Cards
    function renderFeedbacks() {
      const container = document.getElementById('feedbackList');
      if (feedbacks.length === 0) {
        container.innerHTML = `
          <div class="text-center py-8 text-slate-400">
            <i class="fa-regular fa-comments text-4xl mb-2"></i>
            <p>No feedback submitted yet.</p>
          </div>`;
        return;
      }

      container.innerHTML = feedbacks.map(item => `
        <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 transition hover:shadow-md">
          <div class="flex justify-between items-start mb-2">
            <div>
              <h4 class="font-bold text-slate-800">${item.name}</h4>
              <p class="text-xs text-slate-500">${item.email} • <span class="font-medium text-indigo-600">${item.branch}</span></p>
            </div>
            <div class="flex items-center space-x-1 text-amber-400 text-xs">
              ${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)}
            </div>
          </div>
          <p class="text-sm text-slate-600">${item.comment}</p>
          <p class="text-xs text-slate-400 mt-2 text-right">${item.date}</p>
        </div>
      `).join('');
    }

    // Update Dashboard Stats
    function updateStats() {
      document.getElementById('totalFeedback').textContent = feedbacks.length;
      
      const avg = feedbacks.reduce((acc, curr) => acc + curr.rating, 0) / feedbacks.length;
      document.getElementById('avgRating').textContent = avg.toFixed(1);

      const branchCounts = feedbacks.reduce((acc, curr) => {
        acc[curr.branch] = (acc[curr.branch] || 0) + 1;
        return acc;
      }, {});
      
      const topBranch = Object.keys(branchCounts).reduce((a, b) => branchCounts[a] > branchCounts[b] ? a : b, 'N/A');
      document.getElementById('topBranch').textContent = topBranch;
    }
  </script>
</body>
</html>
